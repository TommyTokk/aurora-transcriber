[package]
name = "aurora"
version = "0.1.0"
edition = "2021"

[lib]
name = "aurora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Optional native toolchains on Windows/Linux; Metal remains enabled on macOS.
[features]
default = []
asr-cuda = ["transcribe-cpp/cuda", "transcribe-cpp-sys/cuda"]
asr-vulkan = ["transcribe-cpp/vulkan", "transcribe-cpp-sys/vulkan"]

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0" # Required for native file selection
tauri-plugin-opener = "2.0" # Backend-only model folder opening
tauri-plugin-fs = "2.0"     # Required for Tauri v2 filesystem operations
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
libloading = "0.8"
sha2 = "0.10"
regex = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

# ONNX Runtime - Base (Dynamic loading)
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["load-dynamic"] }

# Keep the prerelease FFI dependency aligned with the pinned wrapper.
ort-sys = { version = "=2.0.0-rc.9", default-features = false }

# Pin both layers: the pre-1.0 native ABI must match the safe wrapper exactly.
transcribe-cpp = { version = "=0.2.4", default-features = false }
transcribe-cpp-sys = { version = "=0.2.4", default-features = false }

# Audio & Tokenizers
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.15"
num-integer = "0.1"
ndarray = "0.15"
tokenizers = "0.20"
hf-hub = "0.4"

# Target-specific Execution Providers
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["coreml"] }
transcribe-cpp = { version = "=0.2.4", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["directml", "cuda"] }

[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["cuda"] }

[build-dependencies]
sha2 = "0.10"
serde_json = "1.0"
tauri-build = { version = "2.0", features = [] } # Required for Tauri v2 app bundling


[dev-dependencies]
tauri = { version = "2.0", features = ["test"] }
hound = "3.5"
